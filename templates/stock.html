{% extends 'base.html' %} 
{% block title %} Stock {% endblock %}
{% block content %}
<div>

    <p>This is the stock page</p>

    <div>

      <table id="example" class="display">
         <thead>
            <tr>
               <th>Stock Id</th>
               <th>PID</th>
               <th>Quantity</th>
               <th>Created At</th>
              
            </tr>
         </thead>
         <tbody>
            {% for stock in stock %}
            <tr>
               <td>{{ stock[0] }}</td>
               <td>{{ stock[1] }}</td>
               <td>{{ stock[2] }}</td>
               <td>{{ stock[3] }}</td>
            </tr>
            {% endfor %}
         </tbody>
      </table>
   </div>




</div>
{% endblock %}
